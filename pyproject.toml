[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gic-plan-to-perform"
version = "0.2.0"
description = "AI-Powered Plan-to-Perform: Commodity Forecast, Financial Driver Engine & Real-Time Market Intelligence"
requires-python = ">=3.10"
dependencies = [
    # Slim set — matches requirements.txt (~300 MB installed).
    # Vercel reads this file via uv; keep it lean so it fits the 500 MB free limit.
    # For local dev / Docker install the [full] extra or use requirements-local.txt.

    # ── Data Processing ──
    "numpy>=1.24.0",
    "pandas>=2.0.0",

    # ── ML ──
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",

    # ── API & Web ──
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.25.0",
    "python-multipart>=0.0.9",

    # ── Infrastructure ──
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    "joblib>=1.3.0",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
# Full local / Docker stack — includes all data connectors and ML libs.
# Install with: pip install -e ".[full]"
full = [
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "yfinance>=0.2.36",
    "ccxt>=4.2.0",
    "ffn>=1.0.0",
    "fredapi>=0.5.1",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "matplotlib>=3.8.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
]
notebook = [
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
]
llm = [
    "transformers>=4.36.0",
    "torch>=2.0.0",
    "sentencepiece>=0.1.99",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
